<script>
"use strict";

/* ============ PROGRAM — rotation-based ============ */
function wu(rounds,items,finish){ return {rounds:rounds,items:items,finish:finish}; }
const WARMUP_SQUAT = wu("3 rounds, smooth:",[
  {n:"6/side",move:"Half-Kneeling Windmill"},{n:"10",move:"Goblet Squat"},
  {n:"12",move:"Band Pull-Apart"},{n:"8/side",move:"Bird Dog"}],"then 3 min easy row.");

  {n:"8",move:"Band Pull-Through"},{n:"8/side",move:"Single-Leg Glute Bridge"},
  {n:"8",move:"Scap Pull-ups"},{n:"10",move:"Dead Bug"}],"then 3 min easy row.");
const CONDPOOL = [
  {a:"5 rounds — 250m row @ moderate / rest :60", b:"4 rounds — 12 KB swings / 10 push-ups / :30 plank / rest :60"},
  {a:"12 min steady row, nose-breathing pace", b:"3 rounds — :40 jump rope / 10 KB swings / :30 dead bug / rest :60"},
  {a:"6 × (1 min moderate row / 1 min easy)", b:"4 rounds — 20 step-ups / short carry / :30 side plank ea / rest :60"},
  {a:"500-400-300-200m row, rest :60 between", b:"5 rounds — 8 KB swings / 8 push-ups / 8 air squats / rest :45"}
];
const PROGRAM = {
  phases: [
    { id:1, name:"Reintroduction & Reconditioning", weeks:"1–6", weekCount:6, accent:"#347a4c",

    { id:2, name:"Foundation: Strength-Hypertrophy Base", weeks:"7–18", weekCount:12, accent:"#2f8f88",

        B:"@30X1 · 3×8–10", C:"@2011 · 3×10–12/leg", hold:"3 × :40",

      squat:["Back Squat","Front Squat","Goblet Squat","Box Squat","Front → Back Squat Complex","Tempo Back Squat"],
      hinge:["Conventional Deadlift","Trap-Bar Deadlift","Romanian Deadlift","Deadlift from Blocks","Single-Leg Romanian Deadlift","Good Morning"],
      push:["Incline DB Bench Press","Flat DB Bench Press","Z-Press","DB Strict Press","Close-Grip Bench Press","Standing Barbell Press"],

/* ============ SESSION GENERATOR ============ */
function pick(arr,i){ return arr[((i%arr.length)+arr.length)%arr.length]; }
function coreMode(name){ return /plank|hold|carry/i.test(name||"")?"hold":"strength"; }
function generateSession(phaseId,week,stype){
  const p=phaseById(phaseId); if(!p) return null;
  const isSquat=stype==="A", wk=week-1, sc=p.scheme;
  const main = isSquat? pick(p.squat,wk) : pick(p.hinge,wk);
  const push = pick(p.push,wk), pull = pick(p.pull,wk+1);
  const leg  = pick(p.legacc,wk+2), core = pick(p.core,wk+1);
  const cond = pick(CONDPOOL,wk + (isSquat?0:2));
  const isDeload = /deload/i.test(weekNote(phaseId,week)||"");
  const blocks=[
    {bid:"A", type:"SINGLE", mode:"strength", name:main,
      meta:isDeload?("DELOAD — 2 sets · ~70% · easy"):sc.A, restSec:sc.restA, cue:sc.cue, sets:isDeload?2:sc.setsA},
    {bid:"B1", type:"SUPERSET", mode:"strength", name:push, meta:sc.B, restSec:sc.restB, sets:3},
    {bid:"B2", type:"SUPERSET", mode:"strength", name:pull, meta:sc.B, restSec:sc.restB, sets:3},
    {bid:"C1", type:"SUPERSET", mode:"strength", name:leg, meta:sc.C, restSec:sc.restC, sets:3},
    {bid:"C2", type:"SUPERSET", mode:coreMode(core), name:core, meta:sc.hold, restSec:50, sets:3},
    {bid:"D", type:"CONDITIONING", mode:"conditioning", name:"Conditioning (standalone)", optA:cond.a, optB:cond.b},
    {bid:"P", type:"POST", mode:"note", name:"Post (optional)", desc:sc.post}
  ];
  return { name: isSquat?"Full Body — Squat Day":"Full Body — Hinge Day",
    warmup: isSquat?WARMUP_SQUAT:WARMUP_HINGE, blocks:blocks };
}

/* ============ SCHEDULE ============ */
const ANCHOR = "2026-05-12";
function phaseForProgramWeek(pw){
  let acc=0;
  for(const p of PROGRAM.phases){ if(pw<=acc+p.weekCount) return {phase:p.id, week:pw-acc}; acc+=p.weekCount; }
  return null;
}
function totalProgramWeeks(){ let t=0; PROGRAM.phases.forEach(p=>t+=p.weekCount); return t; }
function dateToProgramSession(iso){
  const d=new Date(iso+"T12:00:00"), a=new Date(ANCHOR+"T12:00:00");
  const days=Math.floor((d-a)/86400000);
  if(days<0) return null;
  const dow=d.getDay();
  let stype=null; if(dow===2)stype="A"; else if(dow===5)stype="B"; else return null;
  const pw=Math.floor(days/7)+1;
  if(pw>totalProgramWeeks()) return null;
  const pi=phaseForProgramWeek(pw);
  if(!pi) return null;
  return {phase:pi.phase, week:pi.week, stype:stype, programWeek:pw};
}
function plannedTitle(ps){
  const g=generateSession(ps.phase,ps.week,ps.stype);
  return g?g.name:("Session "+ps.stype);
}

  try {
    const raw = localStorage.getItem(KEY);

    alert("Storage unavailable — logging won't be saved. Open this from Safari (not a file preview).");

}
function save(){

function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmtDate(iso){ if(!iso) return ""; const p=iso.split("-"); return (+p[1])+"-"+(+p[2])+"-"+p[0].slice(2); }
function fmtMMSS(s){ s=Math.max(0,s|0); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
function monthLabel(ym){ if(!ym||ym.length<7) return "Undated"; const p=ym.split("-"); return MONTHS[(+p[1])-1]+" "+p[0]; }

function sName(t){ return t==="A"?"Squat":(t==="B"?"Hinge":(t==="Home"?"Home":"")); }
function num(v){ const n=parseFloat(v); return isNaN(n)?null:n; }
function weekNote(phase,week){ const p=phaseById(phase); return (p&&p.weekNotes&&p.weekNotes[week])||null; }
function topSetWeight(sets){ let m=0; (sets||[]).forEach(s=>{ const w=num(s.weight); if(w!=null&&w>m)m=w; }); return m; }
function exerciseHistory(name, excludeId){
  if(!name) return [];
  const out=[];
  DB.sessions.forEach(s=>{
    if(s.id===excludeId) return;
    (s.blocks||[]).forEach(b=>{
      if(b.name===name && b.sets && b.sets.some(x=>x.weight||x.reps)) out.push({date:s.date, sets:b.sets});
    });
  });
  out.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  return out;
}
function lastPerf(name, excludeId){ const h=exerciseHistory(name,excludeId); return h.length?h[0]:null; }

  const m=DB.sessions.filter(s=>s.stype===stype && s.id!==excludeId && !s.archived).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  return m.length?m[0]:null;
}

/* ============ REST TIMER ============ */
let TIMER={endAt:0,iv:null}, audioCtx=null;
function beep(){
  try{ if(!audioCtx) return;
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value=880; g.gain.value=0.25; o.start(); o.stop(audioCtx.currentTime+0.18);
  }catch(e){}
}
function startTimer(sec){
  try{ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); audioCtx.resume(); }catch(e){}
  if(TIMER.iv) clearInterval(TIMER.iv);
  TIMER.endAt=Date.now()+sec*1000; tickTimer();
  TIMER.iv=setInterval(tickTimer,250);
}
function tickTimer(){
  if(!TIMER.endAt) return;
  const left=Math.round((TIMER.endAt-Date.now())/1000);
  if(left<=0){ const r=!!TIMER.iv; stopTimer(); if(r){ beep(); setTimeout(beep,250); setTimeout(beep,500); } }
  else updateTimerUI(left);
}
function stopTimer(){ if(TIMER.iv) clearInterval(TIMER.iv); TIMER.iv=null; TIMER.endAt=0; updateTimerUI(0); }
function updateTimerUI(left){
  const t=$("#hTimer");
  if(left>0){ t.style.display="flex"; t.textContent="⏱ "+fmtMMSS(left); }
  else { t.style.display="none"; t.textContent=""; }
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) tickTimer(); });

  x.onclick=()=>{ input.value=""; input.dispatchEvent(new Event("input",{bubbles:true})); upd(); input.focus(); };
  input.addEventListener("input",upd);
  setTimeout(upd,0);
  wrap.appendChild(x);
  return wrap;
}

function nextPlanned(withinDays){
  const start=new Date(todayISO()+"T12:00:00");
  for(let i=0;i<(withinDays||14);i++){
    const d=new Date(start.getTime()+i*86400000);
    const iso=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    const ps=dateToProgramSession(iso);
    if(ps){
      const logged=DB.sessions.some(s=>s.date===iso && (s.stype==="A"||s.stype==="B"));
      if(!logged || i>0) return {iso:iso,ps:ps};
    }
  }
  return null;
}

/* ============ BUILD DRAFT ============ */
function startSession(phase,week,stype,dateIso){
  let draft={ id:"s-"+Date.now(), date:dateIso||todayISO(), phase, week, stype,
    title:"", warmup:"", warmupDone:false, blocks:[],
    watch:{duration:"",calories:"",avgHR:"",maxHR:"",hrRec:"",zones:""},
    bodyweight:"", recovery:"", notes:"" };
  if(stype==="Home"){
    draft.title="Home — Supplementary";
    draft.warmup="5–10 min easy mobility before you start.";
    draft.blocks=[{ bid:"H", type:"HOME", mode:"note", name:"Home session",
      desc:"Pick one — A: Full-Body Flow (3 rounds: 12 goblet squat / 10 DB floor press / 12 DB row / 12 DB RDL / :30 plank, then 8–10 min easy cardio) · B: Mobility + Core + Pump · C: Easy Conditioning + Reset. Low priority — never let it tax the GYM days.",
      logged:{done:false,notes:""} }];
  } else if(stype==="Custom"){
    draft.title="Custom Session"; draft.warmup=""; draft.blocks=[];
  } else {
    const sess=generateSession(phase,week,stype);
    draft.title=sess.name; draft.warmup=sess.warmup;
    draft.blocks=sess.blocks.map(b=>{
      const nb=Object.assign({},b);
      if(b.mode==="strength"||b.mode==="hold"){
        nb.sets=[]; const n=b.sets||3;
        const lp=lastPerf(b.name,null);
        for(let i=0;i<n;i++){
          let w="";
          if(lp){ const ls=lp.sets[i]||lp.sets[lp.sets.length-1]; if(ls) w=ls.weight||""; }
          nb.sets.push({weight:w,reps:"",rir:""});
        }
      } else if(b.mode==="conditioning"){ nb.logged={option:"A",result:""}; }
      else if(b.mode==="note"){ nb.logged={done:false,notes:""}; }
      return nb;
    });
  }
  STATE.draft=draft; STATE.editId=null;
  go("log");
}

function readForm(){

  const out={ id:d.id, date:$("#f_date").value||todayISO(), phase:d.phase, week:d.week, stype:d.stype,
    title: d.stype==="Custom" ? ($("#f_title")?$("#f_title").value:"Custom Session") : d.title,
    warmup:d.warmup, warmupDone: $("#f_wu")?$("#f_wu").checked:false,
    blocks:[], watch:{}, bodyweight: $("#f_bw")?$("#f_bw").value:"",
    recovery:$("#f_recovery").value, notes:$("#f_notes").value, _editId:STATE.editId };
  document.querySelectorAll("#blockWrap > .card").forEach(card=>{
    const idx=+card.dataset.block, src=d.blocks[idx];

    const nmInput=card.querySelector(".exname-input");
    if(nmInput) nb.name=nmInput.value;

      nb.sets=[];
      card.querySelectorAll(".setrow").forEach(r=>{ const o={};
        r.querySelectorAll("input").forEach(inp=>{ if(inp.dataset.f) o[inp.dataset.f]=inp.value; });
        nb.sets.push(o); });

    } else if(src.mode==="note"){
      nb.logged={ done: card.querySelector(".note-done").checked, notes: card.querySelector(".note-notes").value };

/* ============ PROGRESS ============ */
function sparkline(values,w,h){
  if(!values.length) return "";
  w=w||268; h=h||46; const pad=5;
  if(values.length===1) return "<svg class='spark' width='"+w+"' height='"+h+"'><circle cx='"+(w/2)+"' cy='"+(h/2)+"' r='4' fill='#1d4a2e'/></svg>";
  const mn=Math.min(...values), mx=Math.max(...values), rng=(mx-mn)||1;
  const pts=values.map((v,i)=>{ const x=pad+i*(w-2*pad)/(values.length-1); const y=h-pad-((v-mn)/rng)*(h-2*pad); return [x,y]; });
  const line=pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const dots=pts.map(p=>"<circle cx='"+p[0].toFixed(1)+"' cy='"+p[1].toFixed(1)+"' r='3' fill='#1d4a2e'/>").join("");
  return "<svg class='spark' width='"+w+"' height='"+h+"' viewBox='0 0 "+w+" "+h+"'><polyline points='"+line+"' fill='none' stroke='#347a4c' stroke-width='2'/>"+dots+"</svg>";
}
function movePattern(name){
  const n=(name||"").toLowerCase();
  if(/squat/.test(n) && !/split|bulgarian|cyclist/.test(n)) return "Squat";
  if(/split squat|bulgarian|lunge|step.?up|single.?leg|\bsl\b|pistol/.test(n)) return "Single-Leg";
  if(/deadlift|\brdl\b|romanian|good.?morning|hip thrust|glute|swing|hinge|clean|snatch|high pull/.test(n)) return "Hinge";
  if(/bench|press|push.?up|\bdip\b|overhead|jerk|throw/.test(n)) return "Press";
  if(/\brow\b|pull.?up|chin.?up|pulldown|\blat\b|face.?pull|curl|pull.?apart/.test(n)) return "Pull";
  if(/plank|core|\bab\b|abs|dead.?bug|pallof|hollow|sit.?up|knee|leg raise|windmill|bird.?dog|rotation|carry|slam/.test(n)) return "Core";
  return "Other";
}

function renderProgList(wrap){
  wrap.innerHTML="";
  const q=(progFilter.q||"").trim().toLowerCase(), type=progFilter.type;
  let names=[];
  DB.sessions.forEach(s=>(s.blocks||[]).forEach(b=>{ if(b.sets && b.name && names.indexOf(b.name)<0) names.push(b.name); }));
  names=names.filter(nm=>{
    if(q && nm.toLowerCase().indexOf(q)<0) return false;
    if(type!=="All" && movePattern(nm)!==type) return false;
    return true;
  });
  if(!names.length){ wrap.appendChild(el("div","empty","No movements match.")); return; }
  names.sort((a,b)=>{ const ha=exerciseHistory(a),hb=exerciseHistory(b); return (hb[0]?hb[0].date:"").localeCompare(ha[0]?ha[0].date:""); });
  const total=names.length;
  names.slice(0,60).forEach(nm=>{
    const h=exerciseHistory(nm);
    if(!h.length) return;
    let pr=0,prReps="";
    h.forEach(e=>e.sets.forEach(s=>{ const wv=num(s.weight); if(wv!=null&&wv>pr){ pr=wv; prReps=s.reps||""; } }));
    const series=[...h].reverse().map(e=>topSetWeight(e.sets)).filter(v=>v>0);
    const d=el("div"); d.style.padding="10px 0"; d.style.borderBottom="1px solid #eef1ee";
    d.innerHTML="<div style='font-weight:700;font-size:14px'>"+esc(nm)+" <span class='pill' style='font-weight:600'>"+esc(movePattern(nm))+"</span></div>"+
      "<div class='prline'><span class='muted'>Best set</span><span class='v'>"+(pr?pr+" lb"+(prReps?" × "+prReps:""):"—")+"</span></div>"+
      "<div class='prline'><span class='muted'>Sessions logged</span><span class='v'>"+h.length+"</span></div>";
    if(series.length>=2) d.insertAdjacentHTML("beforeend", sparkline(series));
    wrap.appendChild(d);
  });
  if(total>60) wrap.appendChild(el("div","muted","Showing 60 of "+total+" — search to narrow."));
}

function exportLog(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
  const file=new File([blob],"Workout Log.json",{type:"application/json"});
  DB.lastExport=fmtDate(todayISO()); save();
  if(navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:"Workout Log"}).catch(()=>{});
  } else {
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download="Workout Log.json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
  }
}
function copyLogText(){
  let t="WORKOUT LOG\n";
  [...DB.sessions].sort((a,b)=>(a.date||"").localeCompare(b.date||"")).forEach(s=>{
    t+="\n=== "+fmtDate(s.date)+" · "+(s.archived?"archived":("Phase "+s.phase+" Wk "+s.week))+" · "+(s.title||s.stype)+" ===\n";
    (s.blocks||[]).forEach(b=>{
      if(b.sets){ const set=b.sets.filter(x=>x.weight||x.reps).map(x=>(x.weight?x.weight+"x":"")+(x.reps||"")+(x.rir?" (RIR "+x.rir+")":"")).join(", ");
        if(set) t+=(b.bid?b.bid+" ":"")+b.name+": "+set+"\n"; }
      else if(b.logged && b.mode==="conditioning"){ if(b.logged.result) t+=(b.bid||"")+" Cond (Opt "+b.logged.option+"): "+b.logged.result+"\n"; }
    });
    const w=s.watch||{};
    if(w.duration||w.avgHR) t+="Watch: "+(w.duration?w.duration+"min ":"")+(w.calories?w.calories+"cal ":"")+(w.avgHR?"avgHR "+w.avgHR+" ":"")+(w.maxHR?"maxHR "+w.maxHR:"")+"\n";
    if(s.bodyweight) t+="Bodyweight: "+s.bodyweight+" lb\n";
    if(s.recovery) t+="Soreness: "+s.recovery+"\n";
    if(s.notes) t+="Notes: "+s.notes+"\n";
  });
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(()=>alert("Log copied. Paste it into a chat with Claude."));
  else alert(t);
}
function importLog(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
    const obj=JSON.parse(r.result);
    const incoming = Array.isArray(obj) ? obj : obj.sessions;
    if(!Array.isArray(incoming)) throw 0;
    const byId={}; DB.sessions.forEach(s=>{ byId[s.id]=s; });
    let added=0, filled=0;
    incoming.forEach(s=>{
      if(!s || !s.id) return;
      if(!byId[s.id]){ DB.sessions.push(s); byId[s.id]=s; added++; }
      else {
        const ex=byId[s.id]; let touched=false;
        if(s.watch){ ex.watch=ex.watch||{}; ["duration","calories","avgHR","maxHR","hrRec","zones"].forEach(k=>{
          if((!ex.watch[k]||ex.watch[k]==="") && s.watch[k]){ ex.watch[k]=s.watch[k]; touched=true; } }); }
        if((!ex.bodyweight||ex.bodyweight==="") && s.bodyweight){ ex.bodyweight=s.bodyweight; touched=true; }
        if((!ex.recovery||ex.recovery==="") && s.recovery){ ex.recovery=s.recovery; touched=true; }
        if((!ex.notes||ex.notes==="") && s.notes){ ex.notes=s.notes; touched=true; }
        if(touched) filled++;
      }
    });
    if(obj.bodyweight && Array.isArray(obj.bodyweight)){
      obj.bodyweight.forEach(bwe=>{ if(bwe&&bwe.date) addBodyweight(bwe.date,bwe.lbs); });
    }
    save();
    alert("Import done — "+added+" new session(s) added, "+filled+" existing updated. Total: "+DB.sessions.length+".");
    go("home");
  }catch(err){ alert("That file couldn't be read as a workout log."); } };
  r.readAsText(f);
}

/* ============ PLATE CALCULATOR ============ */
function openPlateCalc(){
  const PLATES=[45,35,25,10,5,2.5];
  const ov=el("div","modal");
  const card=el("div","modalcard");
  card.innerHTML="<h2>🧮 Plate Calculator</h2>";
  card.appendChild(el("label","fld","Bar weight"));
  const bar=el("select"); [45,35,15].forEach(v=>{ const o=el("option",null,v+" lb"); o.value=v; bar.appendChild(o); });
  bar.value=String((DB.settings&&DB.settings.barWeight)||45);
  card.appendChild(bar);
  card.appendChild(el("label","fld","Target total weight (lb)"));
  const tgt=el("input"); tgt.inputMode="decimal"; tgt.placeholder="e.g. 135"; card.appendChild(tgt);
  const out=el("div","plate-out"); out.innerHTML="<span class='muted'>Enter a target weight.</span>"; card.appendChild(out);
  function calc(){
    const b=num(bar.value), t=num(tgt.value);
    if(t==null){ out.innerHTML="<span class='muted'>Enter a target weight.</span>"; return; }
    if(t<b){ out.innerHTML="<span class='muted'>Target is below the bar ("+b+" lb).</span>"; return; }
    let rem=(t-b)/2, list=[];
    PLATES.forEach(p=>{ while(rem>=p-0.001){ list.push(p); rem-=p; } });
    let html="<div class='big'>"+(list.length?list.join(" + "):"just the bar")+"</div><span class='muted'>per side · bar "+b+" lb</span>";
    if(rem>0.01) html+="<br><span class='muted'>≈ "+(rem*2).toFixed(1)+" lb short of exact</span>";
    out.innerHTML=html;
  }
  bar.onchange=()=>{ if(DB.settings) DB.settings.barWeight=num(bar.value); save(); calc(); };
  tgt.oninput=calc;
  const close=el("button","big-btn","Close"); close.style.marginTop="14px"; close.onclick=()=>ov.remove();
  card.appendChild(close);
  ov.appendChild(card);
  ov.onclick=(e)=>{ if(e.target===ov) ov.remove(); };
  document.body.appendChild(ov);
  setTimeout(()=>{ try{tgt.focus();}catch(e){} },100);
}

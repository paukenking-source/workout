<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #eef1f5; color: #1f2733; -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 600px; margin: 0 auto; padding-bottom: 96px; }
  header.app {
    background: linear-gradient(160deg, #4884c8, #2c5d94);
    color: #fff; padding: calc(env(safe-area-inset-top) + 14px) 14px 14px;

  }
  header.app .row { display: flex; align-items: center; gap: 8px; }
  header.app h1 { font-size: 18px; margin: 0; font-weight: 700; }
  header.app .sub { font-size: 12px; opacity: .85; margin-top: 2px; }
  .iconbtn {
    background: rgba(255,255,255,.18); border: none; color: #fff;
    width: 38px; height: 38px; border-radius: 10px; font-size: 17px;
    display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
  }
  .iconbtn:active { background: rgba(255,255,255,.32); }
  #hTimer {
    display: none; align-items: center; gap: 4px; cursor: pointer;
    background: #f6c050; color: #4a3500; font-weight: 800; font-size: 14px;
    padding: 7px 11px; border-radius: 10px; flex-shrink: 0;
  }
  main { padding: 14px; }
  .card { background: #fff; border-radius: 14px; padding: 14px; margin-bottom: 12px;
    box-shadow: 0 1px 3px rgba(20,40,70,.07); }
  .card h2 { margin: 0 0 4px; font-size: 16px; }
  .muted { color: #6b7685; font-size: 13px; }
  .big-btn { display: block; width: 100%; border: none; cursor: pointer;
    background: linear-gradient(160deg, #4884c8, #2c5d94); color: #fff;
    font-size: 17px; font-weight: 700; padding: 16px; border-radius: 14px; margin-bottom: 12px; }
  .big-btn:active { opacity: .85; }
  .big-btn.ghost { background: #fff; color: #2c5d94; border: 1.5px solid #cdd8e6; font-weight: 600; font-size: 15px; }
  .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .tools button { background: #fff; color: #2c5d94; border: 1.5px solid #cdd8e6;
    border-radius: 12px; padding: 13px 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .tools button:active { background: #eef2f7; }
  .focus-card { background: linear-gradient(160deg, #eaf1f9, #dde8f4); border: 1px solid #d2e0f0; }
  .resume-card { background: #fff6e6; border: 1.5px solid #f0d18a; }
  .pillrow { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .pill { background: #eef2f7; color: #3a4858; border-radius: 20px; padding: 3px 10px; font-size: 11px; font-weight: 600; }
  .pill.badge { background: #2c5d94; color: #fff; }
  .pill.type { background: #e7eef7; color: #2c5d94; }
  .pill.warn { background: #fff0e0; color: #b9651a; }
  .pill.good { background: #e3f5ea; color: #237544; }
  .pill.bad  { background: #fbe6e6; color: #b03a3a; }
  .banner { border-radius: 11px; padding: 10px 12px; margin-bottom: 12px; font-size: 13px; line-height: 1.45; }
  .banner b { display: block; margin-bottom: 2px; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; }
  .banner.good { background: #e3f5ea; color: #1d6038; border: 1px solid #b9e3c8; }
  .banner.warn { background: #fff3e0; color: #97570f; border: 1px solid #f0d3a8; }
  .banner.bad  { background: #fbe6e6; color: #962f2f; border: 1px solid #efbcbc; }
  .banner.info { background: #e7eef9; color: #2c4f7e; border: 1px solid #c2d3ea; }
  label.fld { display: block; font-size: 12px; font-weight: 600; color: #56616f; margin: 10px 0 4px; }
  input, select, textarea { font-family: inherit; font-size: 16px; color: #1f2733;

  input:focus, select:focus, textarea:focus { outline: none; border-color: #4884c8; }

  .meta { font-size: 12.5px; color: #5a6675; }

  .ltime { font-size: 12px; color: #2c5d94; background: #eef3f9; border-radius: 7px; padding: 6px 8px; margin-top: 6px; }

  .setrow .setn { font-size: 13px; font-weight: 700; color: #8593a3; text-align: center; }

  .setrow .rm { background: #f4e3e3; border: none; color: #c0504d; border-radius: 7px; height: 36px; font-size: 16px; cursor: pointer; }
  .colhdr { display: grid; grid-template-columns: 26px 1fr 1fr 1fr 30px; gap: 6px; font-size: 10.5px;
    color: #93a0b0; font-weight: 700; text-transform: uppercase; margin-top: 8px; text-align: center; }
  .colhdr.hold { grid-template-columns: 26px 1fr 1fr 30px; }
  .blockftr { display: flex; gap: 8px; margin-top: 8px; }
  .addset { background: #eef2f7; border: 1px dashed #b9c6d6; color: #46688f; border-radius: 8px;
    padding: 9px; flex: 1; font-size: 13px; font-weight: 600; cursor: pointer; }
  .restbtn { background: #fef0d0; border: 1px solid #f0d18a; color: #8a6210; border-radius: 8px;
    padding: 9px 12px; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .opt { display: flex; gap: 8px; align-items: flex-start; margin-top: 8px; padding: 9px;
    border: 1.5px solid #d6dde6; border-radius: 9px; }
  .opt.sel { border-color: #4884c8; background: #f1f6fc; }
  .opt input { width: auto; margin-top: 2px; }
  .opt .t { font-size: 13px; }
  .opt .t b { font-size: 12px; color: #2c5d94; }
  .chk { display: flex; align-items: center; gap: 9px; margin-top: 4px; }
  .chk input { width: 22px; height: 22px; }
  .chk span { font-size: 14px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .hist { display: flex; align-items: center; gap: 10px; padding: 11px 4px; border-bottom: 1px solid #eef1f5; cursor: pointer; }
  .hist:last-child { border-bottom: none; }
  .hist .dot { width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0; background: #2c5d94;
    color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; }
  .hist .dot.B { background: #4884c8; }
  .hist .dot.Home { background: #6b8aa5; font-size: 11px; }
  .hist .info { flex: 1; min-width: 0; }
  .hist .info .l1 { font-weight: 600; font-size: 14px; }
  .hist .info .l2 { font-size: 12px; color: #7a8696; }
  .hist .arr { color: #c2ccd8; font-size: 18px; }
  .miniwarn { display: inline-block; background: #fff0e0; color: #b9651a; font-size: 10px;

  .savebar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 60;
    background: rgba(255,255,255,.96); border-top: 1px solid #e0e5ec;
    padding: 10px 14px calc(env(safe-area-inset-bottom) + 10px); display: flex; gap: 8px;
    max-width: 600px; margin: 0 auto; }
  .savebar button { flex: 1; border: none; border-radius: 11px; padding: 14px; font-size: 15px; font-weight: 700; cursor: pointer; }
  .savebar .save { background: #2e9e5b; color: #fff; }
  .savebar .cancel { background: #eef1f5; color: #5a6675; flex: 0 0 92px; }
  .sectiontitle { font-size: 12px; font-weight: 800; letter-spacing: .5px; color: #93a0b0;
    text-transform: uppercase; margin: 18px 4px 6px; }
  .note-warn { font-size: 12.5px; background: #fff6ec; color: #b9651a; border-radius: 8px; padding: 9px; margin-top: 6px; }
  .steps { font-size: 13px; line-height: 1.55; color: #3a4858; }
  .steps li { margin-bottom: 5px; }
  a { color: #2c5d94; }
  .empty { text-align: center; color: #93a0b0; font-size: 13px; padding: 18px 0; }
  .modal { position: fixed; inset: 0; background: rgba(20,35,55,.55); z-index: 80;
    display: flex; align-items: center; justify-content: center; padding: 18px; }
  .modalcard { background: #fff; border-radius: 16px; padding: 18px; width: 100%; max-width: 380px; }
  .modalcard h2 { margin: 0 0 10px; font-size: 17px; }
  .plate-out { background: #f1f6fc; border-radius: 10px; padding: 12px; margin-top: 12px; font-size: 14px; }
  .plate-out .big { font-size: 20px; font-weight: 800; color: #2c5d94; }
  .spark { margin-top: 8px; display: block; }
  .prline { display: flex; justify-content: space-between; font-size: 13px; margin-top: 4px; }
  .prline .v { font-weight: 700; color: #2c5d94; }
</style>
</head>

/* ============ STORAGE ============ */
const KEY = "av_workout_log_v1";
let DB = { version:2, sessions:[], bodyweight:[], activeDraft:null, lastExport:null, settings:{barWeight:45} };

function freshDB(){ return { version:2, sessions:[], bodyweight:[], activeDraft:null, lastExport:null, settings:{barWeight:45} }; }
function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if(raw){ DB = JSON.parse(raw); migrate(); }
    else { DB = freshDB(); seed(); save(); }
  } catch(e){
    alert("Storage unavailable — logging won't be saved. Open this from Safari (not a file preview).");
    DB = freshDB();
  }
}
function migrate(){
  if(!DB.sessions) DB.sessions=[];

/* ============ HELPERS ============ */
const $ = s => document.querySelector(s);
const main = () => $("#main");
function el(tag,cls,html){ const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmtDate(iso){ if(!iso) return ""; const p=iso.split("-"); return (+p[1])+"-"+(+p[2])+"-"+p[0].slice(2); }
function fmtMMSS(s){ s=Math.max(0,s|0); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function phaseById(id){ return PROGRAM.phases.find(p=>p.id===id); }
function sName(t){ return t==="A"?"Squat":(t==="B"?"Hinge":(t==="Home"?"Home":"")); }
function num(v){ const n=parseFloat(v); return isNaN(n)?null:n; }

function exerciseHistory(name, excludeId){
  if(!name) return [];
  const out=[];
  DB.sessions.forEach(s=>{
    if(s.id===excludeId) return;
    (s.blocks||[]).forEach(b=>{
      if(b.name===name && b.sets && b.sets.some(x=>x.weight||x.reps))
        out.push({date:s.date, sets:b.sets});
    });
  });
  out.sort((a,b)=>b.date.localeCompare(a.date));
  return out;
}
function lastPerf(name, excludeId){ const h=exerciseHistory(name,excludeId); return h.length?h[0]:null; }
function lastSessionOfType(stype, excludeId){
  const m=DB.sessions.filter(s=>s.stype===stype && s.id!==excludeId).sort((a,b)=>b.date.localeCompare(a.date));
  return m.length?m[0]:null;
}
function weekNote(phase,week){ const p=phaseById(phase); return (p&&p.weekNotes&&p.weekNotes[week])||null; }
function topSetWeight(sets){ let m=0; (sets||[]).forEach(s=>{ const w=num(s.weight); if(w!=null&&w>m)m=w; }); return m; }

/* ============ REST TIMER ============ */
let TIMER={left:0,iv:null}, audioCtx=null;
function beep(){
  try{
    if(!audioCtx) return;
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value=880; g.gain.value=0.25; o.start();
    o.stop(audioCtx.currentTime+0.18);
  }catch(e){}
}
function startTimer(sec){
  try{ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); audioCtx.resume(); }catch(e){}
  if(TIMER.iv) clearInterval(TIMER.iv);
  TIMER.left=sec; updateTimerUI();
  TIMER.iv=setInterval(()=>{
    TIMER.left--;
    if(TIMER.left<=0){ stopTimer(); beep(); setTimeout(beep,250); setTimeout(beep,500); }
    else updateTimerUI();
  },1000);
}
function stopTimer(){ if(TIMER.iv) clearInterval(TIMER.iv); TIMER.iv=null; TIMER.left=0; updateTimerUI(); }
function updateTimerUI(){
  const t=$("#hTimer");
  if(TIMER.left>0){ t.style.display="flex"; t.textContent="⏱ "+fmtMMSS(TIMER.left); }
  else { t.style.display="none"; t.textContent=""; }
}

/* ============ BUILD DRAFT ============ */
function startSession(phase,week,stype){
  const p=phaseById(phase);
  let draft={ id:"s-"+Date.now(), date:todayISO(), phase, week, stype,
    title:"", warmup:"", warmupDone:false, blocks:[],
    watch:{duration:"",calories:"",avgHR:"",maxHR:"",hrRec:"",zones:""},
    bodyweight:"", recovery:"", notes:"" };

  if(stype==="Home"){
    draft.title="Home — Supplementary";
    draft.warmup="5–10 min easy mobility before you start.";
    draft.blocks=[{ bid:"H", type:"HOME", mode:"note", name:"Home session",
      desc:"Pick one — A: Full-Body Flow (3 rounds: 12 goblet squat / 10 DB floor press / 12 DB row / 12 DB RDL / :30 plank, then 8–10 min easy cardio) · B: Mobility + Core + Pump · C: Easy Conditioning + Reset. Low priority — never let it tax the GYM days.",
      logged:{done:false,notes:""} }];
  } else if(stype==="Custom" || !p.detailed){
    draft.title="Custom Session"; draft.warmup=""; draft.blocks=[];
  } else {
    const sess=p.sessions[stype];
    draft.title=sess.name; draft.warmup=sess.warmup;
    draft.blocks=sess.blocks.map(b=>{
      const nb=Object.assign({},b);
      if(b.mode==="strength"||b.mode==="hold"){
        nb.sets=[]; const n=b.sets||3;
        const lp=lastPerf(b.name,null);
        for(let i=0;i<n;i++){
          let w="";
          if(lp){ const ls=lp.sets[i]||lp.sets[lp.sets.length-1]; if(ls) w=ls.weight||""; }
          nb.sets.push({weight:w,reps:"",rir:""});
        }
      } else if(b.mode==="conditioning"){ nb.logged={option:"A",result:""}; }
      else if(b.mode==="note"){ nb.logged={done:false,notes:""}; }
      return nb;
    });
  }
  STATE.draft=draft; STATE.editId=null;
  go("log");
}

function buildBlockCard(b,idx){
  const card=el("div","card"); card.dataset.block=idx;
  const hdr=el("div","blockhdr");
  hdr.appendChild(el("span","pill badge",esc(b.bid)));
  hdr.appendChild(el("span","pill type",esc(b.type)));
  card.appendChild(hdr);

  if(b.custom){
    const nm=el("div","ex-name"); const ni=el("input"); ni.className="exname-input";
    ni.placeholder="Exercise name"; ni.value=b.name||""; nm.appendChild(ni); card.appendChild(nm);
  } else card.appendChild(el("div","ex-name",esc(b.name)));

  if(b.meta) card.appendChild(el("div","meta",esc(b.meta)));
  if(b.swap) card.appendChild(el("div","swap","swap: "+esc(b.swap)));
  if(b.cue) card.appendChild(el("div","cue",esc(b.cue)));

  if((b.mode==="strength"||b.mode==="hold") && !b.custom){
    const lp=lastPerf(b.name, STATE.draft?STATE.draft.id:null);
    if(lp){
      const txt=lp.sets.filter(s=>s.weight||s.reps).map(s=>(s.weight?s.weight:"–")+(b.mode==="hold"?("×"+(s.reps||"?")+"s"):("×"+(s.reps||"?")))).join(", ");
      if(txt) card.appendChild(el("div","ltime","Last ("+fmtDate(lp.date)+"): "+esc(txt)));
    }
  }

  if(b.mode==="strength"||b.mode==="hold"){
    const hold=b.mode==="hold";
    const ch=el("div",hold?"colhdr hold":"colhdr");
    ch.innerHTML=hold?"<div>Set</div><div>Load</div><div>Secs</div><div></div>":"<div>Set</div><div>Weight</div><div>Reps</div><div>RIR</div><div></div>";
    card.appendChild(ch);
    const rows=el("div","rows");
    (b.sets||[]).forEach((s,i)=> rows.appendChild(makeSetRow(hold,i,s)));
    card.appendChild(rows);
    const ftr=el("div","blockftr");
    const add=el("button","addset","＋ Set");
    add.onclick=()=>{ rows.appendChild(makeSetRow(hold,rows.children.length,{})); renumber(rows); scheduleSave(); };
    ftr.appendChild(add);
    if(b.restSec){
      const rb=el("button","restbtn","⏱ "+fmtMMSS(b.restSec));
      rb.onclick=()=>startTimer(b.restSec);
      ftr.appendChild(rb);
    }
    card.appendChild(ftr);
  }
  else if(b.mode==="conditioning"){
    const lg=b.logged||{option:"A",result:""};
    [["A",b.optA],["B",b.optB]].forEach(o=>{
      const wd=el("label","opt"+(lg.option===o[0]?" sel":""));
      const r=el("input"); r.type="radio"; r.name="cond"+idx; r.value=o[0]; r.checked=lg.option===o[0];
      r.onchange=()=>{ card.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel")); wd.classList.add("sel"); };
      wd.appendChild(r); wd.appendChild(el("div","t","<b>Option "+o[0]+"</b><br>"+esc(o[1]||""))); card.appendChild(wd);
    });
    const rl=el("textarea"); rl.className="cond-result"; rl.placeholder="Result / pace / how it felt"; rl.value=lg.result||"";
    rl.style.marginTop="8px"; card.appendChild(rl);
  }
  else if(b.mode==="note"){
    const lg=b.logged||{done:false,notes:""};
    if(b.desc) card.appendChild(el("div","meta",esc(b.desc)));
    const ch=el("label","chk"); const cb=el("input"); cb.type="checkbox"; cb.className="note-done"; cb.checked=!!lg.done;
    ch.appendChild(cb); ch.appendChild(el("span",null,"Done")); card.appendChild(ch);
    const nt=el("textarea"); nt.className="note-notes"; nt.placeholder="Notes (optional)"; nt.value=lg.notes||"";
    nt.style.marginTop="8px"; card.appendChild(nt);
  }

  if(b.custom){
    const rm=el("button","big-btn ghost","Remove this exercise");
    rm.style.marginTop="8px"; rm.style.color="#c0504d";
    rm.onclick=()=>{ if(confirm("Remove this exercise?")){ card.remove(); scheduleSave(); } };
    card.appendChild(rm);
  }
  return card;
}
function makeSetRow(hold,n,data){
  const row=el("div",hold?"setrow hold":"setrow"); row.dataset.set="1";
  row.appendChild(el("span","setn",String(n+1)));
  const w=el("input"); w.dataset.f="weight"; w.inputMode="decimal"; w.placeholder=hold?"lb (opt)":"lb"; w.value=data.weight||""; row.appendChild(w);
  const r=el("input"); r.dataset.f="reps"; r.inputMode="numeric"; r.placeholder=hold?"secs":"reps"; r.value=data.reps||""; row.appendChild(r);
  if(!hold){ const ri=el("input"); ri.dataset.f="rir"; ri.inputMode="numeric"; ri.placeholder="RIR"; ri.value=data.rir||""; row.appendChild(ri); }
  const x=el("button","rm","×");
  x.onclick=()=>{ const rows=row.parentNode; row.remove(); renumber(rows); scheduleSave(); };
  row.appendChild(x);
  return row;
}
function renumber(rows){ [...rows.children].forEach((r,i)=>{ const s=r.querySelector(".setn"); if(s)s.textContent=String(i+1); }); }

    blocks:[], watch:{}, bodyweight: $("#f_bw")?$("#f_bw").value:"",
    recovery:$("#f_recovery").value, notes:$("#f_notes").value, _editId:STATE.editId };
  document.querySelectorAll("#blockWrap > .card").forEach(card=>{
    const idx=+card.dataset.block, src=d.blocks[idx];
    const nb=Object.assign({},src);
    const nmInput=card.querySelector(".exname-input");
    if(nmInput) nb.name=nmInput.value;
    if(src.mode==="strength"||src.mode==="hold"){
      nb.sets=[];
      card.querySelectorAll(".setrow").forEach(r=>{ const o={};
        r.querySelectorAll("input").forEach(inp=>{ if(inp.dataset.f) o[inp.dataset.f]=inp.value; });
        nb.sets.push(o); });
    } else if(src.mode==="conditioning"){
      const sel=card.querySelector("input[type=radio]:checked");
      nb.logged={ option: sel?sel.value:"A", result: card.querySelector(".cond-result").value };
    } else if(src.mode==="note"){
      nb.logged={ done: card.querySelector(".note-done").checked, notes: card.querySelector(".note-notes").value };
    }
    out.blocks.push(nb);
  });
  ["duration","calories","avgHR","maxHR","hrRec","zones"].forEach(f=>{ out.watch[f]=$("#w_"+f).value; });
  return out;
}
function saveSession(){
  const out=readForm(); const editId=out._editId; delete out._editId;
  if(editId){ const i=DB.sessions.findIndex(s=>s.id===editId); if(i>=0) DB.sessions[i]=out; else DB.sessions.push(out); }
  else DB.sessions.push(out);
  if(out.bodyweight){ const lb=num(out.bodyweight); if(lb!=null) addBodyweight(out.date,lb); }
  DB.activeDraft=null; save();
  STATE.draft=null; STATE.editId=null;
  const bar=document.querySelector(".savebar"); if(bar)bar.remove();
  go("home");
}
function addBodyweight(date,lbs){
  DB.bodyweight=DB.bodyweight.filter(e=>e.date!==date);
  DB.bodyweight.push({date,lbs});
  DB.bodyweight.sort((a,b)=>a.date.localeCompare(b.date));
}

/* ============ PROGRESS ============ */
function sparkline(values,w,h){
  if(!values.length) return "";
  w=w||268; h=h||46; const pad=5;
  if(values.length===1) return "<svg class='spark' width='"+w+"' height='"+h+"'><circle cx='"+(w/2)+"' cy='"+(h/2)+"' r='4' fill='#2c5d94'/></svg>";
  const mn=Math.min(...values), mx=Math.max(...values), rng=(mx-mn)||1;
  const pts=values.map((v,i)=>{ const x=pad+i*(w-2*pad)/(values.length-1); const y=h-pad-((v-mn)/rng)*(h-2*pad); return [x,y]; });
  const line=pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const dots=pts.map(p=>"<circle cx='"+p[0].toFixed(1)+"' cy='"+p[1].toFixed(1)+"' r='3' fill='#2c5d94'/>").join("");
  return "<svg class='spark' width='"+w+"' height='"+h+"' viewBox='0 0 "+w+" "+h+"'><polyline points='"+line+"' fill='none' stroke='#4884c8' stroke-width='2'/>"+dots+"</svg>";
}
function renderProgress(m){
  $("#hTitle").textContent="Progress"; $("#hSub").textContent="Bodyweight, lifts & PRs";

  const bw=el("div","card");
  bw.appendChild(el("h2",null,"Bodyweight"));
  if(DB.bodyweight.length){
    const latest=DB.bodyweight[DB.bodyweight.length-1];
    bw.appendChild(el("div","muted","Latest: "+latest.lbs+" lb on "+fmtDate(latest.date)));
    bw.insertAdjacentHTML("beforeend", sparkline(DB.bodyweight.map(e=>e.lbs)));
  } else bw.appendChild(el("div","muted","No entries yet."));
  bw.appendChild(el("label","fld","Add an entry"));
  const brow=el("div"); brow.style.display="flex"; brow.style.gap="8px";
  const bd=el("input"); bd.type="date"; bd.value=todayISO();
  const bl=el("input"); bl.inputMode="decimal"; bl.placeholder="lb";
  const ba=el("button","restbtn","Add"); ba.style.flex="0 0 64px";
  ba.onclick=()=>{ const v=num(bl.value); if(v==null){alert("Enter a weight.");return;} addBodyweight(bd.value||todayISO(),v); save(); go("progress"); };
  brow.appendChild(bd); brow.appendChild(bl); brow.appendChild(ba);
  bw.appendChild(brow);
  m.appendChild(bw);

  const names=[];
  DB.sessions.forEach(s=>(s.blocks||[]).forEach(b=>{ if(b.sets && b.name && names.indexOf(b.name)<0) names.push(b.name); }));
  const lifts=el("div","card"); lifts.appendChild(el("h2",null,"Your lifts"));
  if(!names.length) lifts.appendChild(el("div","empty","Log a session to see progress here."));
  else {
    names.sort((a,b)=>{ const ha=exerciseHistory(a),hb=exerciseHistory(b); return (hb[0]?hb[0].date:"").localeCompare(ha[0]?ha[0].date:""); });
    names.forEach(nm=>{
      const h=exerciseHistory(nm);
      if(!h.length) return;
      let pr=0,prReps="";
      h.forEach(e=>e.sets.forEach(s=>{ const w=num(s.weight); if(w!=null&&w>pr){ pr=w; prReps=s.reps||""; } }));
      const series=[...h].reverse().map(e=>topSetWeight(e.sets)).filter(v=>v>0);
      const wrap=el("div"); wrap.style.padding="10px 0"; wrap.style.borderBottom="1px solid #eef1f5";
      wrap.innerHTML="<div style='font-weight:700;font-size:14px'>"+esc(nm)+"</div>"+
        "<div class='prline'><span class='muted'>Best set</span><span class='v'>"+(pr?pr+" lb"+(prReps?" × "+prReps:""):"—")+"</span></div>"+
        "<div class='prline'><span class='muted'>Sessions logged</span><span class='v'>"+h.length+"</span></div>";
      if(series.length>=2) wrap.insertAdjacentHTML("beforeend", sparkline(series));
      lifts.appendChild(wrap);
    });
  }
  m.appendChild(lifts);
}

/* ============ SYNC ============ */
function renderSync(m){
  $("#hTitle").textContent="Sync to Drive"; $("#hSub").textContent=DB.sessions.length+" session(s) logged";
  const c=el("div","card");
  c.innerHTML="<h2>Save your log to Google Drive</h2><div class='muted'>Exports your full log as <b>Workout Log.json</b>. Save it into <b>_Claude / 01_Personal / Health_Fitness</b> so it syncs to your iMac and Claude can read it. Replace the old file each time.</div>";
  const exp=el("button","big-btn","↑  Export / Save to Drive"); exp.style.marginTop="12px"; exp.onclick=exportLog; c.appendChild(exp);
  const cp=el("button","big-btn ghost","📋  Copy log as text"); cp.onclick=copyLogText; c.appendChild(cp);
  if(DB.lastExport) c.appendChild(el("div","muted","Last export: "+esc(DB.lastExport)));
  m.appendChild(c);
  const ic=el("div","card");
  ic.innerHTML="<h2>Restore a backup</h2><div class='muted'>Import a previously saved <b>Workout Log.json</b> to restore your history.</div>";
  const fi=el("input"); fi.type="file"; fi.accept=".json,application/json"; fi.style.marginTop="10px"; fi.onchange=importLog; ic.appendChild(fi);
  m.appendChild(ic);
  const tip=el("div","card");
  tip.innerHTML="<div class='note-warn'>Export after every session. Your phone is the working copy; the file in _Claude is the permanent record. App updates won't touch your data — it's tied to this web address.</div>";
  m.appendChild(tip);
}
function exportLog(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
  const fname="Workout Log.json";
  const file=new File([blob],fname,{type:"application/json"});
  DB.lastExport=fmtDate(todayISO()); save();
  if(navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:"Workout Log"}).catch(()=>{});
  } else {
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download=fname;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
  }
}
function copyLogText(){
  let t="WORKOUT LOG\n";
  [...DB.sessions].sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>{
    t+="\n=== "+fmtDate(s.date)+" · Phase "+s.phase+" Wk "+s.week+" · "+(s.title||s.stype)+" ===\n";
    (s.blocks||[]).forEach(b=>{
      if(b.sets){ const set=b.sets.filter(x=>x.weight||x.reps).map(x=>(x.weight?x.weight+"x":"")+(x.reps||"")+(x.rir?" (RIR "+x.rir+")":"")).join(", ");
        if(set) t+=b.bid+" "+b.name+": "+set+"\n"; }
      else if(b.logged && b.mode==="conditioning"){ if(b.logged.result) t+=b.bid+" Cond (Opt "+b.logged.option+"): "+b.logged.result+"\n"; }
    });
    const w=s.watch||{};
    if(w.duration||w.avgHR) t+="Watch: "+(w.duration?w.duration+"min ":"")+(w.calories?w.calories+"cal ":"")+(w.avgHR?"avgHR "+w.avgHR+" ":"")+(w.maxHR?"maxHR "+w.maxHR:"")+"\n";
    if(s.bodyweight) t+="Bodyweight: "+s.bodyweight+" lb\n";
    if(s.recovery) t+="Soreness: "+s.recovery+"\n";
    if(s.notes) t+="Notes: "+s.notes+"\n";
  });
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(()=>alert("Log copied. Paste it into a chat with Claude."));
  else alert(t);
}
function importLog(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const obj=JSON.parse(r.result); if(!obj.sessions) throw 0;
    if(confirm("Replace current log with this backup? ("+obj.sessions.length+" sessions)")){ DB=obj; migrate(); save(); alert("Restored."); go("home"); }
  }catch(err){ alert("That file couldn't be read as a workout log."); } };
  r.readAsText(f);
}

/* ============ PLATE CALCULATOR ============ */
function openPlateCalc(){
  const PLATES=[45,35,25,10,5,2.5];
  const ov=el("div","modal");
  const card=el("div","modalcard");
  card.innerHTML="<h2>🧮 Plate Calculator</h2>";
  card.appendChild(el("label","fld","Bar weight"));
  const bar=el("select"); [45,35,15].forEach(v=>{ const o=el("option",null,v+" lb"); o.value=v; bar.appendChild(o); });
  bar.value=String((DB.settings&&DB.settings.barWeight)||45);
  card.appendChild(bar);
  card.appendChild(el("label","fld","Target total weight (lb)"));
  const tgt=el("input"); tgt.inputMode="decimal"; tgt.placeholder="e.g. 135"; card.appendChild(tgt);
  const out=el("div","plate-out"); out.innerHTML="<span class='muted'>Enter a target weight.</span>"; card.appendChild(out);
  function calc(){
    const b=num(bar.value), t=num(tgt.value);
    if(t==null){ out.innerHTML="<span class='muted'>Enter a target weight.</span>"; return; }
    if(t<b){ out.innerHTML="<span class='muted'>Target is below the bar ("+b+" lb).</span>"; return; }
    let rem=(t-b)/2, list=[];
    PLATES.forEach(p=>{ while(rem>=p-0.001){ list.push(p); rem-=p; } });
    let html="<div class='big'>"+(list.length?list.join(" + "):"just the bar")+"</div><span class='muted'>per side · bar "+b+" lb</span>";
    if(rem>0.01) html+="<br><span class='muted'>≈ "+(rem*2).toFixed(1)+" lb short of exact</span>";
    out.innerHTML=html;
  }
  bar.onchange=()=>{ if(DB.settings) DB.settings.barWeight=num(bar.value); save(); calc(); };
  tgt.oninput=calc;
  const close=el("button","big-btn","Close"); close.style.marginTop="14px"; close.onclick=()=>ov.remove();
  card.appendChild(close);
  ov.appendChild(card);
  ov.onclick=(e)=>{ if(e.target===ov) ov.remove(); };
  document.body.appendChild(ov);
  setTimeout(()=>{ try{tgt.focus();}catch(e){} },100);
}
